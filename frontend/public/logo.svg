<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#3b82f6"/>
  
  <!-- Company badge/visitor icon -->
  <g transform="translate(100, 100)">
    <!-- Person silhouette -->
    <circle cx="0" cy="-30" r="20" fill="white"/>
    <ellipse cx="0" cy="20" rx="30" ry="40" fill="white"/>
    
    <!-- Badge/check mark -->
    <circle cx="45" cy="45" r="25" fill="#10b981"/>
    <path d="M 35 45 L 42 52 L 55 40" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">
    Visitor Report
  </text>
</svg>
